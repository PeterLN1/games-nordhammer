<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f130d">
<title>Trapped in the Forest!</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0f130d; color: #eef0e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .hud {
    position: fixed; left: 0; right: 0; z-index: 5;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px 0;
    pointer-events: none;
  }
  .hud a, .pill-btn {
    pointer-events: auto;
    text-decoration: none; color: #eef0e6; font-size: 13px; font-weight: 600;
    background: rgba(12,16,10,.55); border: 1px solid rgba(255,255,255,.14);
    padding: 8px 13px; border-radius: 999px; backdrop-filter: blur(6px);
  }
  .hud-left { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; pointer-events: none; }
  .hud-left > * { pointer-events: auto; }
  .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; }
  .hud-right h1 {
    margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .2px;
    background: rgba(12,16,10,.55); border: 1px solid rgba(255,255,255,.14);
    padding: 8px 13px; border-radius: 999px; backdrop-filter: blur(6px);
  }

  .pill-btn { border: none; cursor: pointer; }

  .discovery-toast {
    position: fixed; left: 50%; bottom: max(96px, calc(env(safe-area-inset-bottom) + 96px));
    transform: translateX(-50%) translateY(6px);
    z-index: 7; pointer-events: none; max-width: min(84vw, 380px); text-align: center;
    font-size: 14px; line-height: 1.4; color: #f4ecd6; font-style: italic;
    background: rgba(12,16,10,.75); border: 1px solid rgba(255,255,255,.16);
    padding: 10px 16px; border-radius: 16px; backdrop-filter: blur(6px);
    opacity: 0; transition: opacity .6s ease, transform .6s ease;
  }
  .discovery-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hint {
    position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    font-size: 12.5px; color: rgba(238,240,230,.7); text-align: center; width: 88vw; max-width: 420px;
    background: rgba(12,16,10,.55); border: 1px solid rgba(255,255,255,.14);
    padding: 7px 14px; border-radius: 999px; backdrop-filter: blur(6px);
    z-index: 5; transition: opacity .6s ease; pointer-events: none;
  }
  .hint.hidden { opacity: 0; }

  .fps {
    position: fixed; right: 10px; bottom: 10px; z-index: 5;
    font-size: 10px; color: rgba(238,240,230,.35); font-variant-numeric: tabular-nums;
    pointer-events: none;
  }

  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6,8,5,.88); backdrop-filter: blur(4px);
    padding: 24px;
  }
  .overlay.hidden { display: none; }

  .journal-card {
    width: 100%; max-width: 420px; max-height: 78vh; overflow-y: auto;
    background: rgba(18,22,15,.92); border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px; padding: 20px;
  }
  .journal-card h2 { margin: 0 0 4px; font-size: 17px; }
  .journal-card .journal-sub { margin: 0 0 14px; font-size: 12px; color: rgba(238,240,230,.55); }
  .journal-card p { font-size: 14px; line-height: 1.5; font-style: italic; color: #e8e4d2; margin: 0 0 12px; }
  .journal-card .journal-empty { font-style: normal; color: rgba(238,240,230,.5); }
  #journalClose {
    margin-top: 6px; width: 100%; padding: 10px; border-radius: 12px; font-size: 14px; font-weight: 700;
    border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #eef0e6; cursor: pointer;
  }

  .ending-card { text-align: center; padding: 0 12px; max-width: 360px; }
  .ending-title { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
  .ending-message { font-size: 14px; color: rgba(238,240,230,.8); margin-bottom: 22px; line-height: 1.5; }
  .ending-actions { display: flex; gap: 10px; justify-content: center; }
  .ending-actions button {
    font-size: 13px; font-weight: 700; padding: 10px 18px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.14);
  }
  #endingContinue { background: rgba(255,255,255,.08); color: #eef0e6; }
  #endingRestart { background: #d8b06a; color: #241a05; border-color: transparent; }
</style>
</head>
<body>
  <div id="app"></div>

  <div class="hud">
    <div class="hud-left">
      <a href="/">← Spel</a>
      <button class="pill-btn" id="journalToggle">📖 <span id="fragmentCount">0/0</span></button>
    </div>
    <div class="hud-right">
      <h1>Trapped in the Forest!</h1>
    </div>
  </div>

  <div class="discovery-toast" id="discoveryToast"></div>
  <div class="hint" id="hint">Vänster: dra för att gå · Höger: dra för att titta (eller WASD + musdrag)</div>
  <div class="fps" id="fps"></div>

  <div class="overlay hidden" id="journalOverlay">
    <div class="journal-card">
      <h2>Fynd</h2>
      <p class="journal-sub">Det du har hittat i skogen hittills.</p>
      <div id="journalList"></div>
      <button id="journalClose">Stäng</button>
    </div>
  </div>

  <div class="overlay hidden" id="endingOverlay">
    <div class="ending-card">
      <div class="ending-title">Du hittade ut.</div>
      <div class="ending-message">Skogen släppte taget. Bakom dig blir den lika tät och likgiltig som förut, som om ingen någonsin gått där.</div>
      <div class="ending-actions">
        <button id="endingContinue">Fortsätt utforska</button>
        <button id="endingRestart">↺ Börja om</button>
      </div>
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
