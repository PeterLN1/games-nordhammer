<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f7e9ee" data-light="#f7e9ee" data-dark="#1a0a12">
<title>Anti-Ordlek</title>
<script src="/shared/theme.js"></script>
<script src="/shared/profile.js"></script>
<style>
  :root {
    --bg: radial-gradient(120% 90% at 50% 0%, #f7e9ee 0%, #f0e0e8 100%);
    --chrome: rgba(0,0,0,.06);
    --ink: #2a1620;
    --muted: rgba(42,22,32,.6);
    --tile-empty-border: rgba(42,22,32,.22);
    --tile-filled-border: rgba(42,22,32,.5);
    --tile-bg: transparent;
    --key-bg: rgba(42,22,32,.10);
    --key-ink: #2a1620;
    --correct: #3aa65a;
    --present: #c9962c;
    --absent: #8b93a7;
    --accent: #ff4d6d;
    --panel-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme]){
      --bg: radial-gradient(120% 90% at 50% 0%, #3a1120 0%, #1a0a12 60%, #0d0509 100%);
      --chrome: rgba(0,0,0,.35);
      --ink: #ffe8ef;
      --muted: rgba(255,232,239,.6);
      --tile-empty-border: rgba(255,232,239,.34);
      --tile-filled-border: rgba(255,232,239,.55);
      --key-bg: rgba(255,232,239,.12);
      --key-ink: #ffe8ef;
      --absent: #4a2c3a;
      --panel-bg: #23101a;
    }
  }
  :root[data-theme="dark"]{
    --bg: radial-gradient(120% 90% at 50% 0%, #3a1120 0%, #1a0a12 60%, #0d0509 100%);
    --chrome: rgba(0,0,0,.35);
    --ink: #ffe8ef;
    --muted: rgba(255,232,239,.6);
    --tile-empty-border: rgba(255,232,239,.34);
    --tile-filled-border: rgba(255,232,239,.55);
    --key-bg: rgba(255,232,239,.12);
    --key-ink: #ffe8ef;
    --absent: #4a2c3a;
    --panel-bg: #23101a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1a0a12;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    touch-action: manipulation; overscroll-behavior: none;
  }
  #app { display: flex; flex-direction: column; height: 100dvh; background: var(--bg); }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: max(6px, env(safe-area-inset-top)) 12px 6px;
    background: var(--chrome); flex: 0 0 auto;
  }
  header .back, header .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 10px; text-decoration: none;
    color: var(--ink); background: var(--key-bg); font-size: 18px; line-height: 1;
    border: none; cursor: pointer; font-family: inherit;
  }
  header .back:active, header .icon-btn:active { background: rgba(255,77,109,.3); }
  header .icon-btn.active { background: rgba(255,77,109,.35); }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .3px; white-space: nowrap; }
  header .spacer { flex: 1; }

  .mode-switch { display: flex; gap: 6px; justify-content: center; padding: 8px 12px 0; flex: 0 0 auto; }
  .mode-btn {
    flex: 1; max-width: 190px; padding: 9px 10px; border-radius: 10px; border: none;
    background: var(--key-bg); color: var(--muted); font-weight: 700; font-size: 12.5px;
    font-family: inherit; cursor: pointer;
  }
  .mode-btn.active { background: rgba(255,77,109,.28); color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(255,77,109,.55); }
  .mode-btn.locked { opacity: .4; cursor: default; }

  #dayInfo {
    flex: 0 0 auto; text-align: center; font-size: 12.5px; color: var(--muted);
    padding: 6px 10px 0;
  }
  #statusInfo {
    flex: 0 0 auto; text-align: center; font-size: 12.5px; font-weight: 700; color: var(--ink);
    padding: 3px 10px 0;
  }
  #boardWrap { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #board {
    display: grid; grid-template-rows: repeat(6, 1fr); gap: 7px;
    width: min(330px, 78vw);
    height: 100%; max-height: 396px;
    margin: 6px auto;
  }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .row.shake { animation: rowShake .45s; }
  .tile {
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(18px, 6.5vw, 30px); font-weight: 800; text-transform: uppercase;
    border-radius: 7px; border: 2px solid var(--tile-empty-border);
    background: var(--tile-bg); color: var(--ink);
    perspective: 400px;
  }
  .tile.filled { border-color: var(--tile-filled-border); }
  .tile.flip { animation: tileFlip .5s ease; }
  .tile.bounce { animation: tileBounce .55s ease; }
  .tile.state-correct { background: var(--correct); border-color: var(--correct); color: #fff; }
  .tile.state-present { background: var(--present); border-color: var(--present); color: #fff; }
  .tile.state-absent { background: var(--absent); border-color: var(--absent); color: #fff; }
  @keyframes tileFlip { 0% { transform: rotateX(0deg); } 50% { transform: rotateX(-90deg); } 100% { transform: rotateX(0deg); } }
  @keyframes tileBounce { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-16px); } 50% { transform: translateY(0); } 70% { transform: translateY(-7px); } 90% { transform: translateY(0); } }
  @keyframes rowShake {
    10%,90% { transform: translateX(-3px); } 20%,80% { transform: translateX(5px); }
    30%,50%,70% { transform: translateX(-7px); } 40%,60% { transform: translateX(7px); }
  }

  #keyboard { flex: 0 0 auto; padding: 6px 6px max(8px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 7px; max-width: 520px; width: 100%; margin: 0 auto; }
  .kbrow { display: flex; gap: 5px; justify-content: center; }
  .key {
    flex: 1; max-width: 38px; height: 48px; border-radius: 7px; border: none;
    background: var(--key-bg); color: var(--key-ink); font-weight: 700; font-size: 14px;
    display: flex; align-items: center; justify-content: center; text-transform: uppercase;
    font-family: inherit; cursor: pointer; padding: 0;
  }
  .key:active { filter: brightness(1.15); }
  .key.wide { max-width: 60px; font-size: 11px; }
  .key.state-correct { background: var(--correct); color: #fff; }
  .key.state-present { background: var(--present); color: #fff; }
  .key.state-absent { background: var(--absent); color: #fff; opacity: .7; }

  /* ---- overlay (regler / resultat / statistik) ---- */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  #overlay.show { display: flex; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    background: var(--panel-bg); color: var(--ink); border-radius: 16px;
    padding: 22px 20px 18px; max-width: 380px; width: 100%; max-height: 86vh; overflow-y: auto;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .panel .emoji { font-size: 42px; }
  .panel h2 { margin: 6px 0 6px; font-size: 22px; }
  .panel p { margin: 0 0 4px; color: var(--muted); font-size: 14.5px; line-height: 1.5; }
  .panel button {
    width: 100%; margin-top: 12px; padding: 13px; border: none; border-radius: 11px;
    background: var(--accent); color: #2a0009; font-weight: 700; font-size: 15px;
    cursor: pointer; font-family: inherit;
  }
  .panel button.ghost { background: var(--key-bg); color: var(--ink); }
  .panel button:active { transform: scale(.98); }

  .stat-row { display: flex; justify-content: center; gap: 22px; margin: 14px 0 10px; }
  .stat-item .n { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat-item .l { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }

  .dist { text-align: left; margin: 10px 0 4px; }
  .dist-row { display: flex; align-items: center; gap: 7px; font-size: 12px; margin: 3px 0; }
  .dist-row .num { width: 9px; text-align: right; font-weight: 700; color: var(--muted); }
  .dist-row .bar { background: var(--absent); color: #fff; text-align: right; padding: 3px 7px; border-radius: 4px; min-width: 20px; font-weight: 700; font-size: 12px; }
  .dist-row .bar.hi { background: var(--accent); }

  .lb-title { font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 16px 0 8px; text-align: left; }
  .lb-list { text-align: left; }
  .lb-row { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 9px; font-size: 14px; }
  .lb-row:nth-child(odd) { background: var(--key-bg); }
  .lb-row.me { background: rgba(255,77,109,.2); box-shadow: inset 0 0 0 1px rgba(255,77,109,.5); }
  .lb-rank { width: 22px; text-align: center; font-weight: 700; color: var(--muted); }
  .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-time { font-variant-numeric: tabular-nums; color: var(--muted); }
  .lb-guesses { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 11px; font-weight: 700; background: var(--key-bg); padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
  .lb-empty { color: var(--muted); font-size: 13px; padding: 6px 2px; text-align: left; }
  .lb-hof-month { font-weight: 400; color: var(--muted); font-size: 12.5px; }

  .rules-list { text-align: left; font-size: 14px; line-height: 1.6; margin: 10px 0; }
  .rules-list .ex { display: flex; gap: 5px; margin: 8px 0 4px; }
  .rules-list .ex .tile { width: 34px; height: 34px; font-size: 17px; border-radius: 5px; }

  .lb-input {
    flex: 1; padding: 11px 12px; border-radius: 9px; border: none;
    background: var(--key-bg); color: var(--ink); font-family: inherit; font-size: 14px;
  }

  #toast {
    position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(10px);
    z-index: 10000; background: rgba(20,20,30,.92); color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #glitter { position: fixed; inset: 0; z-index: 200; pointer-events: none; overflow: hidden; }
  .glitter-piece { position: absolute; top: -20px; left: 0; will-change: transform, opacity; animation: glitterFall linear forwards; }
  @keyframes glitterFall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--drift, 0px), 110vh) rotate(360deg); opacity: .85; }
  }
  @media (prefers-reduced-motion: reduce) {
    .glitter-piece { display: none; }
  }
</style>
</head>
<body>
  <div id="app">
    <header>
      <a class="back" href="/" aria-label="Till startsidan">‹</a>
      <h1>🙈 Anti-Ordlek</h1>
      <div class="spacer"></div>
      <button class="icon-btn" id="btnProfile" aria-label="Byt profil"></button>
      <button class="icon-btn" id="btnMarathon" aria-label="Maratontabell">🏁</button>
      <button class="icon-btn" id="btnStats" aria-label="Statistik">📊</button>
      <button class="icon-btn" id="btnRules" aria-label="Regler">❔</button>
    </header>
    <div id="modeSwitch" class="mode-switch">
      <button class="mode-btn" id="modeDailyBtn">📅 Dagens ord</button>
      <button class="mode-btn" id="modePracticeBtn">🎯 Egen utmaning</button>
    </div>
    <div id="dayInfo"></div>
    <div id="statusInfo"></div>
    <div id="boardWrap"><div id="board"></div></div>
    <div id="keyboard"></div>
  </div>
  <div id="overlay"><div class="panel" id="panel"></div></div>
  <div id="toast"></div>
  <div id="glitter" aria-hidden="true"></div>

  <script src="words.js"></script>
  <script>
  "use strict";

  /* ---------- Ord & dagligt val ----------
     Anti-Ordlek delar ordlistan med vanliga Ordlek men väljer ett EGET
     dagens-ord, garanterat olika det vanliga spelets — annars kunde
     samma ord dyka upp i båda spelen samma dag. */
  var WORD_LEN = 5, MAX_GUESSES = 6, JOKER_BUDGET = 3;
  var GUESS_SET = new Set(ORDLEK_GUESSES);
  var ANTI_EPOCH = '2026-09-20'; // Anti-Ordlek #1

  function hashStr(str){
    var h = 2166136261 >>> 0; // FNV-1a
    for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  }
  function todayIso(){ return new Date().toISOString().slice(0,10); } // UTC, samma dygnsgräns för alla

  // Måste hållas i synk med ORDLEK_DAILY_OVERRIDES i ordlek/index.html —
  // den listan avgör exakt vilket ord vanliga Ordlek visar en given dag.
  // Den här kopian används BARA för att räkna ut vilket ord Anti-Ordlek
  // måste undvika samma dag (se antiDailyAnswer nedan), aldrig för att
  // visa det ordet i Anti-Ordlek självt.
  var NORMAL_DAILY_OVERRIDES = {
    '2026-08-09': 'havre',
    '2026-08-10': 'slant',
    '2026-08-11': 'solig',
    '2026-08-12': 'saker',
    '2026-08-13': 'hitta',
    '2026-08-14': 'major',
    '2026-08-15': 'gurka'
  };
  function normalDailyAnswer(dateStr){
    if(NORMAL_DAILY_OVERRIDES[dateStr]) return NORMAL_DAILY_OVERRIDES[dateStr];
    return ORDLEK_ANSWERS[hashStr('ordlek-word:' + dateStr) % ORDLEK_ANSWERS.length];
  }
  // Fastlåsning av redan spelade Anti-Ordlek-dagar, samma mönster och
  // samma anledning som ORDLEK_DAILY_OVERRIDES i ordlek/index.html: om
  // ORDLEK_ANSWERS redigeras flyttar sig alla hash-index. Fyll på här
  // INNAN listan ändras nästa gång, för varje datum som redan varit
  // "idag".
  var ORDLEK_ANTI_DAILY_OVERRIDES = {
  };
  function antiDailyAnswer(dateStr){
    if(ORDLEK_ANTI_DAILY_OVERRIDES[dateStr]) return ORDLEK_ANTI_DAILY_OVERRIDES[dateStr];
    var avoid = normalDailyAnswer(dateStr);
    var start = hashStr('ordlek-anti-word:' + dateStr) % ORDLEK_ANSWERS.length;
    for(var i=0;i<ORDLEK_ANSWERS.length;i++){
      var w = ORDLEK_ANSWERS[(start + i) % ORDLEK_ANSWERS.length];
      if(w !== avoid) return w;
    }
    return ORDLEK_ANSWERS[start]; // otänkbart i praktiken: hela listan vore samma ord
  }
  function dayNumber(dateStr){
    var d = Date.parse(dateStr + 'T00:00:00Z'), e = Date.parse(ANTI_EPOCH + 'T00:00:00Z');
    return Math.floor((d - e) / 86400000) + 1;
  }
  var SV_MONTHS = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
  function formatDateSv(iso){
    var p = iso.split('-'); return (+p[2]) + ' ' + (SV_MONTHS[(+p[1])-1] || '') + ' ' + p[0];
  }
  function formatMonthSv(monthStr){
    var p = monthStr.split('-'); return (SV_MONTHS[(+p[1])-1] || '') + ' ' + p[0];
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* ---------- Statistik & sparat läge ---------- */
  var STATS_KEY = 'ordlek-anti:stats';
  var RULES_KEY = 'ordlek-anti:seenRules';
  function loadStats(){
    try {
      var s = JSON.parse(localStorage.getItem(STATS_KEY));
      if(s && s.caughtDistribution && s.caughtDistribution.length === MAX_GUESSES) return s;
    } catch(e){}
    return { played: 0, survived: 0, currentStreak: 0, maxStreak: 0, caughtDistribution: [0,0,0,0,0,0], lastWinDate: null };
  }
  function saveStats(s){ try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch(e){} }
  function recordResult(survived, guessCount, dateStr){
    var s = loadStats();
    s.played++;
    if(survived){
      s.survived++;
      var prevDay = new Date(Date.parse(dateStr + 'T00:00:00Z') - 86400000).toISOString().slice(0,10);
      s.currentStreak = (s.lastWinDate === prevDay) ? s.currentStreak + 1 : 1;
      s.maxStreak = Math.max(s.maxStreak, s.currentStreak);
      s.lastWinDate = dateStr;
    } else {
      s.currentStreak = 0;
      s.caughtDistribution[guessCount-1]++;
    }
    saveStats(s);
    return s;
  }

  // Övningsläget har egen statistik under en annan nyckel — resultat i
  // familjetävlingen ska aldrig påverka den, och tvärtom.
  var PRACTICE_STATS_KEY = 'ordlek-anti:practiceStats';
  function loadPracticeStats(){
    try {
      var s = JSON.parse(localStorage.getItem(PRACTICE_STATS_KEY));
      if(s && s.caughtDistribution && s.caughtDistribution.length === MAX_GUESSES) return s;
    } catch(e){}
    return { played: 0, survived: 0, currentStreak: 0, maxStreak: 0, caughtDistribution: [0,0,0,0,0,0] };
  }
  function savePracticeStats(s){ try { localStorage.setItem(PRACTICE_STATS_KEY, JSON.stringify(s)); } catch(e){} }
  function recordPracticeResult(survived, guessCount){
    var s = loadPracticeStats();
    s.played++;
    if(survived){
      s.survived++;
      s.currentStreak++;
      s.maxStreak = Math.max(s.maxStreak, s.currentStreak);
    } else {
      s.currentStreak = 0;
      s.caughtDistribution[guessCount-1]++;
    }
    savePracticeStats(s);
    return s;
  }

  var GAME_PREFIX = 'ordlek-anti:game:';
  function gameKey(dateStr){ return GAME_PREFIX + dateStr; }
  function loadGame(dateStr){
    try { var g = JSON.parse(localStorage.getItem(gameKey(dateStr))); if(g && g.answer) return g; } catch(e){}
    return null;
  }
  function saveGame(g){ try { localStorage.setItem(gameKey(g.date), JSON.stringify(g)); } catch(e){} }
  function pruneOldGames(keepDate){
    try {
      var toRemove = [];
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf(GAME_PREFIX) === 0 && k !== gameKey(keepDate)) toRemove.push(k);
      }
      toRemove.forEach(function(k){ localStorage.removeItem(k); });
    } catch(e){}
  }

  // Namnet kommer från den delade profilen (shared/profile.js) — samma
  // profil används i alla spel.
  function getName(){ var p = NordhammerProfile.current(); return p ? p.name : ''; }

  /* ---------- Spelläge ---------- */
  var today = todayIso();
  var state = loadGame(today);
  // Samma skydd som i vanliga Ordlek: om dagens ord skulle bytas ut i
  // efterhand matchar inte ett redan sparat lokalt läge längre — kasta
  // det så spelaren automatiskt får ett nytt, tomt bräde.
  if(state && state.answer !== antiDailyAnswer(today)) state = null;
  var wasFreshState = !state; // avgör om vi ska fråga servern om profilen redan spelat idag (se Start)
  if(!state){
    state = { date: today, answer: antiDailyAnswer(today), guesses: [], status: 'playing', startedAt: Date.now(), finishedAt: null, submitted: false, jokersLeft: JOKER_BUDGET };
    saveGame(state);
    pruneOldGames(today);
  } else if(state.jokersLeft == null){
    // Sparat parti från innan jokersystemet fanns — ge det jokerbudgeten
    // istället för att låta det tyst bli 0 (och därmed fullt hårt läge).
    state.jokersLeft = JOKER_BUDGET;
  }
  var animating = false;
  var keyState = {}; // bokstav -> 'correct'|'present'|'absent'

  /* ---------- Övningsläge ----------
     Ett separat, icke-sparat spel med ett slumpat ord — för att kunna öva
     hur många gånger som helst per dag, utan att påverka statistik,
     familjetopplista eller maratontabell. */
  var dailyState = state;
  var practiceMode = false;
  function randomPracticeWord(){
    var todayWord = antiDailyAnswer(today); // uteslut dagens ord — annars kan ett slumpmässigt sammanträffande spoila det
    var pool = ORDLEK_ANSWERS.filter(function(w){ return w !== todayWord; });
    if(!pool.length) pool = ORDLEK_ANSWERS;
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function startPractice(){
    if(animating) return;
    practiceMode = true;
    state = { date: null, answer: randomPracticeWord(), guesses: [], status: 'playing', startedAt: Date.now(), finishedAt: null, submitted: true, jokersLeft: JOKER_BUDGET };
    current = '';
    animating = false;
    hideOverlay();
    render();
  }
  function exitPractice(){
    practiceMode = false;
    state = dailyState;
    current = '';
    animating = false;
    hideOverlay();
    render();
    if(dailyState.status === 'blocked') renderBlockedPanel(dailyState.blockedSummary);
  }

  function evaluateGuess(guess, answer){
    var marks = new Array(WORD_LEN).fill('absent');
    var remain = {};
    var i;
    for(i=0;i<WORD_LEN;i++){
      if(guess[i] === answer[i]) marks[i] = 'correct';
      else remain[answer[i]] = (remain[answer[i]] || 0) + 1;
    }
    for(i=0;i<WORD_LEN;i++){
      if(marks[i] === 'correct') continue;
      var c = guess[i];
      if(remain[c] > 0){ marks[i] = 'present'; remain[c]--; }
    }
    return marks;
  }
  function marksEqual(a,b){ for(var i=0;i<a.length;i++){ if(a[i]!==b[i]) return false; } return true; }
  function rebuildKeyState(){
    keyState = {};
    var rank = { absent: 0, present: 1, correct: 2 };
    state.guesses.forEach(function(g){
      for(var i=0;i<WORD_LEN;i++){
        var c = g.word[i], m = g.marks[i];
        if(!keyState[c] || rank[m] > rank[keyState[c]]) keyState[c] = m;
      }
    });
  }

  /* ---------- Hårt läge: varje ny gissning måste följa ledtrådarna
     hittills, precis som Wordles "hard mode" — annars kan man bara mata
     in orelaterade ord och aldrig riskera något.

     JOKER_BUDGET: en delad pott jokrar för HELA partiet. Grön-lås och
     gul-krav är alltid obligatoriska (aldrig förhandlingsbara). En
     gissning som återanvänder en grå bokstav är annars förbjuden — MEN
     om jokrar återstår tillåts den ändå, och kostar en joker, oavsett
     vilken eller hur många gråa bokstäver just den gissningen återanvänder.
     Slut på jokrar = fullt hårt läge igen.

     Historik: fullt hårt läge (inga undantag) tvingade en kollision i
     ~51-57% av simulerade partier. Att permanent undanta vanliga
     konsonanter (R/S/T/L/N) sänkte det till ~29-32% men visade sig i
     verkligt spel gå att utnyttja — de bokstäverna gick att återanvända
     obegränsat i flera ord i rad, vilket kändes för lätt trots ett bra
     simuleringsresultat. En kvot (max 1 undantagsbokstav per gissning)
     löste inte det — man kunde fortfarande luta sig mot en gratis
     bokstav VARJE rad, hela partiet. Jokerpotten är det enda som faktiskt
     tar slut: ~30% tvingade kollisioner i simulering, men bara genom en
     begränsad, förbrukningsbar resurs istället för permanent immunitet
     för specifika bokstäver. Se konversationen 2026-09-20/21. ---------- */
  function hardModeConstraints(){
    var green = new Array(WORD_LEN).fill(null);
    var minCount = {};
    state.guesses.forEach(function(g){
      var rowCounts = {};
      for(var i=0;i<WORD_LEN;i++){
        var c = g.word[i], m = g.marks[i];
        if(m === 'correct'){ green[i] = c; rowCounts[c] = (rowCounts[c]||0) + 1; }
        else if(m === 'present'){ rowCounts[c] = (rowCounts[c]||0) + 1; }
      }
      Object.keys(rowCounts).forEach(function(c){ minCount[c] = Math.max(minCount[c]||0, rowCounts[c]); });
    });
    var neverInWord = {};
    state.guesses.forEach(function(g){
      for(var j=0;j<WORD_LEN;j++){
        var c = g.word[j];
        if(g.marks[j] === 'absent' && !minCount[c]) neverInWord[c] = true;
      }
    });
    return { green: green, minCount: minCount, neverInWord: neverInWord };
  }
  // Returnerar { blocked, message, usesJoker }. Grön/gul-brott blockerar
  // alltid; grå-brott blockeras bara om inga jokrar återstår.
  function hardModeCheck(guess){
    var hc = hardModeConstraints();
    var i, c;
    for(i=0;i<WORD_LEN;i++){
      if(hc.green[i] && guess[i] !== hc.green[i]){
        return { blocked: true, message: 'Bokstav ' + (i+1) + ' måste vara "' + hc.green[i].toUpperCase() + '"', usesJoker: false };
      }
    }
    for(c in hc.minCount){
      var have = guess.split('').filter(function(x){ return x === c; }).length;
      if(have < hc.minCount[c]){
        return { blocked: true, message: 'Måste innehålla "' + c.toUpperCase() + '"', usesJoker: false };
      }
    }
    var badGray = null;
    for(c in hc.neverInWord){
      if(guess.indexOf(c) !== -1){ badGray = c; break; }
    }
    if(badGray){
      if(state.jokersLeft > 0) return { blocked: false, message: null, usesJoker: true };
      return { blocked: true, message: '"' + badGray.toUpperCase() + '" ska inte vara med — inga jokrar kvar', usesJoker: false };
    }
    return { blocked: false, message: null, usesJoker: false };
  }

  /* ---------- Kvarvarande kandidater ---------- */
  function computeRemainingCount(){
    return ORDLEK_ANSWERS.filter(function(c){
      return state.guesses.every(function(g){ return marksEqual(evaluateGuess(g.word, c), g.marks); });
    }).length;
  }

  /* ---------- Rendering ---------- */
  var current = '';
  function renderBoard(){
    var html = '';
    for(var r=0;r<MAX_GUESSES;r++){
      html += '<div class="row" data-row="'+r+'">';
      if(r < state.guesses.length){
        var g = state.guesses[r];
        for(var i=0;i<WORD_LEN;i++) html += '<div class="tile filled state-'+g.marks[i]+'">'+esc(g.word[i])+'</div>';
      } else if(r === state.guesses.length && state.status === 'playing'){
        for(var i2=0;i2<WORD_LEN;i2++){
          var ch = current[i2];
          html += '<div class="tile'+(ch?' filled':'')+'">'+(ch?esc(ch):'')+'</div>';
        }
      } else {
        for(var i3=0;i3<WORD_LEN;i3++) html += '<div class="tile"></div>';
      }
      html += '</div>';
    }
    document.getElementById('board').innerHTML = html;
  }
  var KB_ROWS = [
    ['q','w','e','r','t','y','u','i','o','p','å'],
    ['a','s','d','f','g','h','j','k','l','ö','ä'],
    ['ENTER','z','x','c','v','b','n','m','BACK']
  ];
  function renderKeyboard(){
    var html = '';
    KB_ROWS.forEach(function(row){
      html += '<div class="kbrow">';
      row.forEach(function(k){
        if(k === 'ENTER') html += '<button class="key wide" data-key="ENTER">Enter</button>';
        else if(k === 'BACK') html += '<button class="key wide" data-key="BACK">⌫</button>';
        else html += '<button class="key'+(keyState[k]?' state-'+keyState[k]:'')+'" data-key="'+k+'">'+k+'</button>';
      });
      html += '</div>';
    });
    document.getElementById('keyboard').innerHTML = html;
    document.querySelectorAll('.key').forEach(function(btn){
      btn.addEventListener('click', function(){ handleKey(this.getAttribute('data-key')); });
    });
  }
  function renderDayInfo(){
    var el = document.getElementById('dayInfo');
    if(practiceMode){
      el.textContent = 'Nytt slumpat ord — spela hur många gånger du vill';
      return;
    }
    var n = dayNumber(state.date);
    el.textContent = 'Anti-Ordlek-dag #' + n + ' · ' + formatDateSv(state.date);
  }
  // Slagna ihop till en rad (istället för två separata) — annars tar
  // info-raderna för mycket höjd på kortare mobilskärmar och trycker ner
  // eller skymmer brädet, se felrapport 2026-09-21.
  function renderStatusInfo(){
    var el = document.getElementById('statusInfo');
    if(!el) return;
    var n = state.jokersLeft;
    el.textContent = '🔍 ' + computeRemainingCount() + ' ord kvar · 🃏 ' + n + ' ' + (n === 1 ? 'joker' : 'jokrar');
  }
  // Låst tills dagens ord är klart (won/lost/blocked) — annars kunde man
  // byta till Egen utmaning mitt i dagens giv och tappa bort var man var.
  function dailyLocked(){ return dailyState.status === 'playing' || dailyState.status === 'checking'; }
  function renderModeSwitch(){
    var dailyBtn = document.getElementById('modeDailyBtn');
    var practiceBtn = document.getElementById('modePracticeBtn');
    if(!dailyBtn || !practiceBtn) return;
    dailyBtn.classList.toggle('active', !practiceMode);
    practiceBtn.classList.toggle('active', practiceMode);
    practiceBtn.classList.toggle('locked', !practiceMode && dailyLocked());
  }
  function render(){ renderDayInfo(); rebuildKeyState(); renderBoard(); renderKeyboard(); renderStatusInfo(); renderModeSwitch(); }

  /* ---------- Indata ---------- */
  var LETTER_RE = /^[a-zåäö]$/;
  function handleKey(k){
    if(animating || state.status !== 'playing') return;
    if(k === 'ENTER'){ submit(); return; }
    if(k === 'BACK'){ current = current.slice(0,-1); renderBoard(); return; }
    if(LETTER_RE.test(k) && current.length < WORD_LEN){ current += k; renderBoard(); }
  }
  document.addEventListener('keydown', function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if(k === 'Enter'){ handleKey('ENTER'); return; }
    if(k === 'Backspace'){ handleKey('BACK'); return; }
    k = k.toLowerCase();
    if(LETTER_RE.test(k)) handleKey(k);
  });

  function shakeRow(r){
    var row = document.querySelector('.row[data-row="'+r+'"]');
    if(!row) return;
    row.classList.add('shake');
    setTimeout(function(){ row.classList.remove('shake'); }, 460);
  }

  function submit(){
    if(current.length < WORD_LEN){ shakeRow(state.guesses.length); toast('För få bokstäver'); return; }
    if(!GUESS_SET.has(current)){ shakeRow(state.guesses.length); toast('Inte ett ord i listan'); return; }
    // En upprepad gissning ger noll ny information men kan ändå råka
    // klara hardModeCheck (t.ex. genom att spendera en joker) — spärra
    // den explicit, annars går hela poängen med hårt läge (och jokrar)
    // att kringgå genom att bara upprepa samma säkra ord varje rad.
    if(state.guesses.some(function(g){ return g.word === current; })){
      shakeRow(state.guesses.length); toast('Du har redan gissat det ordet'); return;
    }
    var check = hardModeCheck(current);
    if(check.blocked){ shakeRow(state.guesses.length); toast(check.message); return; }
    var word = current;
    var marks = evaluateGuess(word, state.answer);
    var rowIdx = state.guesses.length;
    var rowEl = document.querySelector('.row[data-row="'+rowIdx+'"]');
    animating = true;
    var tiles = rowEl.querySelectorAll('.tile');
    tiles.forEach(function(t,i){
      setTimeout(function(){
        t.classList.add('flip');
        setTimeout(function(){ t.classList.add('filled', 'state-'+marks[i]); }, 250);
      }, i*280);
    });
    var totalDelay = (WORD_LEN-1)*280 + 520;
    setTimeout(function(){
      state.guesses.push({ word: word, marks: marks });
      current = '';
      if(check.usesJoker){
        state.jokersLeft--;
        toast('🃏 Joker använd — ' + state.jokersLeft + ' kvar');
      }
      var caught = marks.every(function(m){ return m === 'correct'; });
      if(caught){
        shakeRow(rowIdx);
        finish(true, rowEl);
      } else if(state.guesses.length >= MAX_GUESSES){
        tiles.forEach(function(t,i){ setTimeout(function(){ t.classList.add('bounce'); }, i*90); });
        finish(false, rowEl);
      } else {
        if(!practiceMode) saveGame(state);
        animating = false;
        rebuildKeyState();
        renderKeyboard();
        renderBoard();
        renderStatusInfo();
      }
    }, totalDelay);
  }

  function finish(caught, rowEl){
    state.status = caught ? 'caught' : 'survived';
    state.finishedAt = Date.now();
    if(!practiceMode) saveGame(state);
    animating = false;
    rebuildKeyState();
    renderKeyboard();
    renderStatusInfo();
    if(navigator.vibrate) try { navigator.vibrate(caught ? 60 : [20,40,20]); } catch(e){}
    if(practiceMode){
      var pstats = recordPracticeResult(!caught, state.guesses.length);
      setTimeout(function(){ showPracticeResultPanel(caught, pstats); }, caught ? 300 : 900);
    } else {
      var stats = recordResult(!caught, state.guesses.length, state.date);
      setTimeout(function(){ showResultPanel(caught, stats); }, caught ? 300 : 900);
    }
  }

  /* ---------- Delning ---------- */
  function shareText(s){
    s = s || state;
    var n = dayNumber(s.date);
    var lines = s.guesses.map(function(g){
      return g.marks.map(function(m){ return m === 'correct' ? '🟩' : (m === 'present' ? '🟨' : '⬛'); }).join('');
    });
    var scoreLabel = s.status === 'survived' ? ('🙈 ' + MAX_GUESSES + '/' + MAX_GUESSES) : ('😬 ' + s.guesses.length + '/' + MAX_GUESSES);
    return 'Anti-Ordlek #' + n + ' ' + scoreLabel + '\n\n' + lines.join('\n') + '\n\ngames.nordhammer.se/ordlek/anti.html';
  }
  function doShare(btn, s){
    var text = shareText(s);
    function flash(){
      toast('Resultat kopierat!');
      if(!btn) return;
      var orig = btn.textContent; btn.textContent = '✓ Kopierat!'; btn.disabled = true;
      setTimeout(function(){ btn.textContent = orig; btn.disabled = false; }, 1600);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(flash).catch(function(){ showShareFallback(text); });
    } else showShareFallback(text);
  }
  function showShareFallback(text){
    var panel = document.getElementById('panel');
    panel.innerHTML =
      '<div class="emoji">🔗</div><h2>Dela resultat</h2>' +
      '<textarea id="shareText" class="lb-input" style="width:100%;height:140px;resize:none" readonly>'+esc(text)+'</textarea>' +
      '<button id="shareCopy">Kopiera</button>' +
      '<button id="shareClose" class="ghost">Stäng</button>';
    document.getElementById('overlay').classList.add('show');
    var ta = document.getElementById('shareText');
    setTimeout(function(){ try { ta.focus(); ta.select(); } catch(e){} }, 50);
    document.getElementById('shareCopy').onclick = function(){
      try { ta.focus(); ta.select(); document.execCommand('copy'); toast('Kopierat!'); } catch(e){}
    };
    document.getElementById('shareClose').onclick = hideOverlay;
  }

  /* ---------- Hur långt du kom, som ett "moves"-tal ----------
     Återanvänder samma backend/poängformel som vanliga Ordlek (lägre
     "moves" = bättre, se server/index.js). 0 = överlevde alla rader,
     upp till MAX_GUESSES = togs på första raden. */
  function survivalMoves(){
    if(state.status === 'caught') return MAX_GUESSES - (state.guesses.length - 1);
    return 0;
  }
  function movesLabel(moves){
    if(moves === 0) return 'Överlevde';
    return 'Föll rad ' + (MAX_GUESSES + 1 - moves);
  }

  /* ---------- Familje-topplista (samma Railway/Supabase-backend som
     vanliga Ordlek) — egen seed-serie ('ordlek-anti:'+datum) så den
     aldrig kolliderar med vanliga Ordleks dagliga lista. ---------- */
  var LEADERBOARD_API = 'https://games-nordhammer-production.up.railway.app';
  function apiBase(){
    try { return (localStorage.getItem('ordlek-anti:api') || LEADERBOARD_API || '').replace(/\/+$/,''); }
    catch(e){ return LEADERBOARD_API; }
  }
  function hasLeaderboard(){ return !!apiBase(); }
  function seedFor(dateStr){ return 'ordlek-anti:' + dateStr; }
  function lbFetchBySeed(seed, cb){
    var base = apiBase(); if(!base) return cb(new Error('ingen topplista'));
    fetch(base + '/api/leaderboard?seed=' + encodeURIComponent(seed) + '&limit=20')
      .then(function(r){ return r.json(); })
      .then(function(d){ cb(d && d.error ? new Error(d.error) : null, (d && d.scores) || []); })
      .catch(function(e){ cb(e); });
  }
  function lbSubmit(payload, cb){
    var base = apiBase(); if(!base) return cb && cb(new Error('ingen topplista'));
    fetch(base + '/api/scores', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
      .then(function(r){ return r.json(); })
      .then(function(d){ cb && cb(d && d.error ? new Error(d.error) : null, d); })
      .catch(function(e){ cb && cb(e); });
  }
  function fmtSeconds(s){
    s = Math.round(s);
    var m = Math.floor(s/60), sec = s%60;
    return m + ':' + (sec<10?'0':'') + sec;
  }
  // Till skillnad från vanliga Ordlek (som bara visar de som löste ordet)
  // visar Anti-Ordlek ALLA — hur långt man kom är själva poängen även om
  // man blev tagen. Rankas efter moves (lägst/bäst först), inte efter
  // servertidens seconds-ordning.
  function lbRenderList(el, list, myName){
    if(!list || !list.length){ el.innerHTML = '<div class="lb-empty">Var först på listan idag!</div>'; return; }
    var sorted = list.slice().sort(function(a,b){
      var am = a.moves == null ? 99 : a.moves, bm = b.moves == null ? 99 : b.moves;
      return am - bm;
    });
    var medals = ['🥇','🥈','🥉'];
    el.innerHTML = sorted.map(function(s,i){
      var me = (myName && s.name === myName) ? ' me' : '';
      var rank = i < 3 ? medals[i] : (i+1);
      var badge = (s.moves != null) ? '<span class="lb-guesses">'+esc(movesLabel(s.moves))+'</span>' : '';
      return '<div class="lb-row'+me+'"><span class="lb-rank">'+rank+'</span>' +
             '<span class="lb-name">'+esc(s.name)+'</span>' +
             badge +
             '<span class="lb-time">'+fmtSeconds(s.seconds)+'</span></div>';
    }).join('');
  }
  function setupLeaderboard(area, caught){
    if(!hasLeaderboard()){ area.innerHTML = ''; return; }
    var seed = seedFor(state.date);
    var moves = survivalMoves();
    function showList(){
      area.innerHTML = '<div class="lb-title">🏆 Dagens familjetopplista</div><div class="lb-list">Laddar…</div>';
      lbFetchBySeed(seed, function(err, list){
        var el = area.querySelector('.lb-list');
        if(err){ el.textContent = 'Kunde inte hämta topplistan'; return; }
        lbRenderList(el, list, getName());
      });
    }
    if(state.submitted){ showList(); return; }
    var seconds = Math.max(1, Math.round((state.finishedAt - state.startedAt)/1000));
    state.submitted = true; saveGame(state);
    lbSubmit({ name:getName(), mode:'ordlek-anti', tiles:WORD_LEN, seconds:seconds, moves:moves, seed:seed }, showList);
    showList();
  }

  /* ---------- Maratontabell ----------
     Samma /api/marathon-endpoint som vanliga Ordlek, men med
     family=ordlek-anti så den bara summerar Anti-Ordleks egna seeds
     (se MARATHON_FAMILIES i server/index.js). */
  function showMarathonPanel(){
    var panel = document.getElementById('panel');
    panel.innerHTML = '<h2>🏁 Maratontabell</h2><div id="marList" class="lb-list">Laddar…</div>' +
      '<button id="pHof" class="ghost">🏆 Hall of fame</button>' +
      '<button id="pClose" class="ghost">Stäng</button>';
    document.getElementById('overlay').classList.add('show');
    document.getElementById('pClose').onclick = hideOverlay;
    document.getElementById('pHof').onclick = showHallOfFamePanel;
    var el = document.getElementById('marList');
    var base = apiBase();
    if(!base){ el.textContent = 'Ingen topplista kopplad.'; return; }
    fetch(base + '/api/marathon?family=ordlek-anti').then(function(r){ return r.json(); }).then(function(d){
      if(d.error){ el.textContent = 'Kunde inte hämta tabellen'; return; }
      if(!d.rows || !d.rows.length){
        el.innerHTML = '<div class="lb-empty">Maratontabellen startar '+formatDateSv(d.seasonStart)+' — häng med!</div>';
        return;
      }
      var medals = ['🥇','🥈','🥉'];
      var myName = getName();
      el.innerHTML = d.rows.map(function(r){
        var rank = r.rank <= 3 ? medals[r.rank-1] : r.rank;
        var me = (myName && r.name === myName) ? ' me' : '';
        return '<div class="lb-row'+me+'"><span class="lb-rank">'+rank+'</span>' +
               '<span class="lb-name">'+esc(r.name)+'</span>' +
               '<span class="lb-guesses">'+r.played+'/'+r.days+'</span>' +
               '<span class="lb-time">'+r.points+' p</span></div>';
      }).join('');
    }).catch(function(){ el.textContent = 'Kunde inte hämta tabellen'; });
  }

  /* ---------- Fallande glitter (regnar så länge Hall of fame är öppen) ---------- */
  var GLITTER_COLORS = ['#ffe27a','#ffffff','#ffd24d'];
  function spawnGlitter(count){
    var layer = document.getElementById('glitter');
    if(!layer) return;
    count = count || 1;
    for(var i=0;i<count;i++){
      var el = document.createElement('div');
      el.className = 'glitter-piece';
      var duration = 3 + Math.random()*2.5;
      var delay = Math.random()*0.3;
      el.style.left = (Math.random()*100) + 'vw';
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = delay + 's';
      el.style.setProperty('--drift', (Math.random()*60 - 30) + 'px');
      if(Math.random() < 0.3){
        el.textContent = '✨';
        el.style.fontSize = (10 + Math.random()*10) + 'px';
      } else {
        var size = 2 + Math.random()*3;
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.borderRadius = '50%';
        el.style.background = GLITTER_COLORS[Math.floor(Math.random()*GLITTER_COLORS.length)];
        el.style.boxShadow = '0 0 6px 1px rgba(255,220,120,.8)';
      }
      layer.appendChild(el);
      setTimeout(function(node){ node.remove(); }, (duration+delay)*1000 + 100, el);
    }
  }
  var glitterTimer = null;
  function startGlitterRain(){
    if(glitterTimer) return;
    spawnGlitter(14);
    glitterTimer = setInterval(function(){ spawnGlitter(4); }, 350);
  }
  function stopGlitterRain(){
    if(glitterTimer){ clearInterval(glitterTimer); glitterTimer = null; }
  }

  /* ---------- Hall of fame (tidigare avslutade månaders segrare) ---------- */
  function showHallOfFamePanel(){
    startGlitterRain();
    var panel = document.getElementById('panel');
    panel.innerHTML = '<h2>🏆 Hall of fame</h2><div id="hofList" class="lb-list">Laddar…</div>' +
      '<button id="pBack" class="ghost">Tillbaka</button>';
    document.getElementById('pBack').onclick = function(){ stopGlitterRain(); showMarathonPanel(); };
    var el = document.getElementById('hofList');
    var base = apiBase();
    if(!base){ el.textContent = 'Ingen topplista kopplad.'; return; }
    fetch(base + '/api/marathon/history?family=ordlek-anti').then(function(r){ return r.json(); }).then(function(d){
      if(d.error){ el.textContent = 'Kunde inte hämta historiken'; return; }
      if(!d.months || !d.months.length){
        el.innerHTML = '<div class="lb-empty">Ingen avslutad månad än — kommer efter första hela kalendermånaden.</div>';
        return;
      }
      el.innerHTML = d.months.map(function(m){
        var monthLabel = formatMonthSv(m.month);
        var names = m.champions.map(function(c){ return esc(c.name); }).join(' & ');
        var points = m.champions[0].points;
        return '<div class="lb-row"><span class="lb-rank">🥇</span>' +
               '<span class="lb-name">'+names+' <span class="lb-hof-month">— '+monthLabel+'</span></span>' +
               '<span class="lb-time">'+points+' p</span></div>';
      }).join('');
    }).catch(function(){ el.textContent = 'Kunde inte hämta historiken'; });
  }

  /* ---------- Redan spelat idag, på en annan enhet? ---------- */
  function checkAlreadyPlayedElsewhere(cb){
    if(!hasLeaderboard()) return cb(null);
    var myName = (getName() || '').trim().toLowerCase();
    if(!myName) return cb(null);
    lbFetchBySeed(seedFor(today), function(err, list){
      if(err || !list) return cb(null); // fail open — ett nätverksfel ska aldrig blockera spel
      var hit = (list || []).filter(function(s){ return (s.name || '').trim().toLowerCase() === myName; })[0];
      cb(hit || null);
    });
  }
  function showAlreadyPlayedElsewhere(hit){
    dailyState.status = 'blocked';
    dailyState.submitted = true; // förhindrar att lbSubmit anropas igen av misstag denna session
    dailyState.blockedSummary = { moves: hit.moves, seconds: hit.seconds };
    saveGame(dailyState);
    if(!practiceMode) renderBlockedPanel(dailyState.blockedSummary);
  }
  function renderBlockedPanel(summary){
    var text = (summary.moves != null)
      ? movesLabel(summary.moves).toLowerCase() + ', ' + fmtSeconds(summary.seconds)
      : 'inget resultat registrerat, ' + fmtSeconds(summary.seconds);
    var panel = document.getElementById('panel');
    panel.innerHTML =
      '<div class="emoji">🔁</div><h2>Redan spelat idag</h2>' +
      '<p>Du (' + esc(getName()) + ') har redan spelat dagens Anti-Ordlek idag, troligen på en annan enhet: ' + text + '.</p>' +
      '<div id="lbArea" class="lb-area"><div class="lb-title">🏆 Dagens familjetopplista</div><div class="lb-list">Laddar…</div></div>' +
      '<button id="pClose" class="ghost">Stäng</button>';
    document.getElementById('overlay').classList.add('show');
    document.getElementById('pClose').onclick = hideOverlay;
    lbFetchBySeed(seedFor(today), function(err, list){
      var el = document.querySelector('#lbArea .lb-list');
      if(!el) return;
      if(err){ el.textContent = 'Kunde inte hämta topplistan'; return; }
      lbRenderList(el, list, getName());
    });
  }

  /* ---------- Paneler ---------- */
  function distHtml(dist, highlightIdx){
    var max = Math.max.apply(null, dist.concat([1]));
    var html = '<div class="dist">';
    dist.forEach(function(count, i){
      var w = Math.max(8, Math.round((count/max)*100));
      html += '<div class="dist-row"><span class="num">'+(i+1)+'</span>' +
              '<span class="bar'+(i===highlightIdx?' hi':'')+'" style="width:'+w+'%">'+count+'</span></div>';
    });
    return html + '</div>';
  }
  function statBlockHtml(stats){
    var pct = stats.played ? Math.round(100*stats.survived/stats.played) : 0;
    return '<div class="stat-row">' +
      '<div class="stat-item"><div class="n">'+stats.played+'</div><div class="l">Spelade</div></div>' +
      '<div class="stat-item"><div class="n">'+pct+'%</div><div class="l">Överlevt</div></div>' +
      '<div class="stat-item"><div class="n">'+stats.currentStreak+'</div><div class="l">Svit</div></div>' +
      '<div class="stat-item"><div class="n">'+stats.maxStreak+'</div><div class="l">Bästa svit</div></div>' +
    '</div>';
  }
  function showResultPanel(caught, stats){
    var panel = document.getElementById('panel');
    panel.innerHTML =
      '<div class="emoji">'+(caught?'😬':'🙈')+'</div>' +
      '<h2>'+(caught?'Du hittade det!':'Du klarade dig!')+'</h2>' +
      '<p>'+(caught ? ('Du gissade <b>'+state.answer.toUpperCase()+'</b> av misstag på rad '+state.guesses.length+' av '+MAX_GUESSES+'.')
                    : ('Ordet var <b>'+state.answer.toUpperCase()+'</b> — du undvek det hela vägen!')) + '</p>' +
      statBlockHtml(stats) +
      '<div style="font-size:11.5px;color:var(--muted);margin:14px 0 2px;text-align:left">Föll i rad</div>' +
      distHtml(stats.caughtDistribution, caught ? state.guesses.length-1 : -1) +
      '<div id="lbArea" class="lb-area"></div>' +
      '<button id="pShare">📋 Dela resultat</button>' +
      '<button id="pPractice" class="ghost">🎯 Fortsätt i Egen utmaning</button>' +
      '<button id="pClose" class="ghost">Stäng</button>';
    document.getElementById('overlay').classList.add('show');
    document.getElementById('pShare').onclick = function(){ doShare(document.getElementById('pShare')); };
    document.getElementById('pPractice').onclick = function(){ hideOverlay(); startPractice(); };
    document.getElementById('pClose').onclick = hideOverlay;
    setupLeaderboard(document.getElementById('lbArea'), caught);
  }
  function showPracticeResultPanel(caught, stats){
    var panel = document.getElementById('panel');
    panel.innerHTML =
      '<div class="emoji">'+(caught?'😬':'🙈')+'</div>' +
      '<h2>'+(caught?'Du hittade det!':'Du klarade dig!')+'</h2>' +
      '<p>'+(caught ? ('Du gissade <b>'+state.answer.toUpperCase()+'</b> av misstag på rad '+state.guesses.length+' av '+MAX_GUESSES+'.')
                    : ('Ordet var <b>'+state.answer.toUpperCase()+'</b> — du undvek det hela vägen!')) + '</p>' +
      statBlockHtml(stats) +
      '<div style="font-size:11.5px;color:var(--muted);margin:14px 0 2px;text-align:left">Föll i rad</div>' +
      distHtml(stats.caughtDistribution, caught ? state.guesses.length-1 : -1) +
      '<p>🎯 Egen utmaning — egen statistik, påverkar inte familjetävlingen.</p>' +
      '<button id="pAgain">🔁 Ny utmaning</button>' +
      '<button id="pDaily" class="ghost">Till dagens ord</button>';
    document.getElementById('overlay').classList.add('show');
    document.getElementById('pAgain').onclick = startPractice;
    document.getElementById('pDaily').onclick = exitPractice;
  }
  function showStatsPanel(){
    var stats = practiceMode ? loadPracticeStats() : loadStats();
    var panel = document.getElementById('panel');
    panel.innerHTML =
      '<h2>'+(practiceMode ? '📊 Egen utmaning' : '📊 Statistik')+'</h2>' +
      statBlockHtml(stats) +
      '<div style="font-size:11.5px;color:var(--muted);margin:14px 0 2px;text-align:left">Föll i rad</div>' +
      distHtml(stats.caughtDistribution, -1) +
      (!practiceMode && dailyState.status !== 'playing' ? '<button id="pShare2">📋 Dela dagens resultat</button>' : '') +
      '<button id="pClose" class="ghost">Stäng</button>';
    document.getElementById('overlay').classList.add('show');
    document.getElementById('pClose').onclick = hideOverlay;
    var ps = document.getElementById('pShare2');
    if(ps) ps.onclick = function(){ doShare(ps, dailyState); };
  }
  function showRulesPanel(){
    var panel = document.getElementById('panel');
    panel.innerHTML =
      '<h2>🙈 Så funkar Anti-Ordlek</h2>' +
      '<p style="text-align:left">Precis som Ordlek — men målet är omvänt. Gissa ord i '+MAX_GUESSES+' rader och få samma färgledtrådar, men undvik att råka gissa exakt rätt ord. Överlever du alla '+MAX_GUESSES+' rader utan en fullträff har du vunnit!</p>' +
      '<div class="rules-list">' +
        '<div class="ex"><div class="tile filled state-correct">O</div><div class="tile filled">R</div><div class="tile filled">D</div><div class="tile filled">E</div><div class="tile filled">T</div></div>' +
        '<div>🟩 Grön = rätt bokstav på rätt plats.</div>' +
        '<div class="ex" style="margin-top:10px"><div class="tile filled">O</div><div class="tile filled state-present">R</div><div class="tile filled">D</div><div class="tile filled">E</div><div class="tile filled">T</div></div>' +
        '<div>🟨 Gul = bokstaven finns med, men på fel plats.</div>' +
        '<div class="ex" style="margin-top:10px"><div class="tile filled">O</div><div class="tile filled">R</div><div class="tile filled state-absent">D</div><div class="tile filled">E</div><div class="tile filled">T</div></div>' +
        '<div>⬛ Grå = bokstaven finns inte i ordet.</div>' +
      '</div>' +
      '<p style="text-align:left"><b>Hårt läge:</b> varje ny gissning måste följa ledtrådarna hittills — gröna bokstäver stannar kvar, gula måste vara med, gråa får inte vara med. Du kan inte gömma dig bakom orelaterade ord.</p>' +
      '<p style="text-align:left">🃏 Du har <b>'+JOKER_BUDGET+' jokrar</b> för hela partiet: en gissning som annars skulle bryta mot en grå bokstav tillåts ändå om du har jokrar kvar — kostar en joker, oavsett vilken bokstav. Utan jokrar gäller hårt läge fullt ut. Annars blir svenskans begränsade ordförråd nästan olösligt i slutet av partiet.</p>' +
      '<p style="text-align:left">🔍-siffran ovanför brädet visar hur många ord i dagens-ord-listan som fortfarande kan vara rätt. Når den 1 är du farligt nära!</p>' +
      '<p style="text-align:left">🏆 Familjetopplistan rankar alla — inte bara de som överlever — efter hur långt de kom. 🏁 Maratontabellen räknar ihop hela månaden, samma golfpoäng-system som vanliga Ordlek.</p>' +
      '<p style="text-align:left"><b>Egen utmaning:</b> ett läge du kan spela hur många gånger som helst, mot din egen statistik — påverkar aldrig familjetävlingen. Byt läge längst upp på sidan — men först när du spelat klart dagens ord.</p>' +
      '<button id="pClose">Nu kör vi!</button>';
    document.getElementById('overlay').classList.add('show');
    document.getElementById('pClose').onclick = hideOverlay;
  }
  function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); stopGlitterRain(); }

  document.getElementById('modeDailyBtn').onclick = function(){ if(practiceMode) exitPractice(); };
  document.getElementById('modePracticeBtn').onclick = function(){
    if(practiceMode) return;
    if(dailyLocked()){ toast('Spela klart dagens ord först'); return; }
    startPractice();
  };
  document.getElementById('btnMarathon').onclick = showMarathonPanel;
  document.getElementById('btnStats').onclick = showStatsPanel;
  document.getElementById('btnRules').onclick = showRulesPanel;
  document.getElementById('overlay').addEventListener('click', function(e){ if(e.target.id === 'overlay') hideOverlay(); });

  var toastTimer = null;
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }

  /* ---------- Profil ---------- */
  function renderProfileBadge(){
    var p = NordhammerProfile.current();
    document.getElementById('btnProfile').textContent = p ? p.avatar : '👤';
  }
  document.getElementById('btnProfile').onclick = function(){
    NordhammerProfile.openSwitcher(function(){ renderProfileBadge(); render(); });
  };

  function showRulesIfFirstTime(){
    try {
      if(!localStorage.getItem(RULES_KEY)){ localStorage.setItem(RULES_KEY, '1'); showRulesPanel(); }
    } catch(e){}
  }

  /* ---------- Start ----------
     Refererar genomgående dailyState (inte den ombytbara `state`) — annars
     kan ett övningspass som startas under nätverkskollen nedan råka styra
     om vad kollen skriver till, se startPractice/showAlreadyPlayedElsewhere. */
  render();
  if(dailyState.status === 'blocked'){
    setTimeout(function(){ renderBlockedPanel(dailyState.blockedSummary); }, 200);
  } else if(dailyState.status === 'playing'){
    if(wasFreshState && hasLeaderboard()) dailyState.status = 'checking';
    else showRulesIfFirstTime();
  } else {
    setTimeout(function(){ showResultPanel(dailyState.status === 'caught', loadStats()); }, 200);
  }
  NordhammerProfile.ensurePicker(function(){
    renderProfileBadge();
    if(dailyState.status === 'checking'){
      checkAlreadyPlayedElsewhere(function(hit){
        if(hit){
          showAlreadyPlayedElsewhere(hit);
        } else {
          dailyState.status = 'playing';
          showRulesIfFirstTime();
        }
      });
    }
  });
  </script>
</body>
</html>
