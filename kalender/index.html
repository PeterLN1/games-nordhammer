<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Spelet har alltid sitt mörka tema, oavsett sajtens tema. -->
<meta name="theme-color" content="#0F1A2B" data-light="#0F1A2B" data-dark="#0F1A2B">
<meta name="color-scheme" content="dark">
<title>Kalendern</title>
<script src="/shared/theme.js"></script>
<script src="/shared/profile.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Kalendern (först Nattåget) — se kalender/SPEC.md. Färgerna nedan är
     Nattågets och gäller tills kalenderns eget tema (theme i
     innehållsfilen) har hämtats; applyTheme() skriver då över dem.
     Spelet har alltid sitt eget tema, oavsett sajtens ljusa/mörka läge. */
  :root {
    --bg: #0F1A2B;
    --surface: #17253B;
    --surface-dark: #0B1422;
    --border: #3A4A63;
    --text: #E8EEF5;
    --muted: #A9B6C8;
    --soft: #C9D3E0;
    --glow: #F2B544;
    --flame: #FFD27A;
    --off: #5B6B84;
    --paper: #F4EBDD;
    --paper-ink: #2A2118;
    --glow-rgb: 242, 181, 68;
    --flame-rgb: 255, 210, 122;
    --on-glow: #1A1406;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 480px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 40px);
  }
  h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; letter-spacing: .01em; }
  p { margin: 0; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  svg { display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---------- Knappar ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 0 20px; border-radius: 12px; border: 0;
    font-weight: 600; font-size: 16px; cursor: pointer; text-decoration: none;
  }
  .btn-primary { background: var(--glow); color: var(--on-glow); }
  .btn-primary:active { filter: brightness(.92); }
  .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn[disabled] { opacity: .5; cursor: default; }
  .btn-block { width: 100%; }
  .icon-btn {
    width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 12px; border: 1px solid var(--border); background: transparent; cursor: pointer; text-decoration: none;
  }

  /* ---------- Toppfält ---------- */
  .topbar { display: flex; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 20px; }
  .topbar .date { flex: 1; text-align: center; color: var(--muted); font-size: 14px; }
  .stars-pill { display: inline-flex; align-items: center; gap: 6px; min-width: 44px; justify-content: flex-end; color: var(--glow); font-weight: 600; }

  /* ---------- Kalendern ---------- */
  .cal-head { text-align: center; margin: 12px 0 20px; }
  .cal-head h1 { font-size: 44px; line-height: 1.1; }
  .cal-head p { color: var(--soft); margin-top: 8px; font-size: 15px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .stat { background: var(--surface); border-radius: 14px; padding: 12px 14px; }
  .stat .label { color: var(--muted); font-size: 13px; }
  .stat .value { font-family: var(--serif); font-size: 28px; display: flex; align-items: center; gap: 8px; }
  .stat .value small { font-family: var(--sans); font-size: 15px; color: var(--muted); }
  .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .grid > * { flex: 0 0 calc((100% - 30px) / 4); }
  .cell {
    aspect-ratio: 1 / 1.08; border-radius: 14px; padding: 8px; text-decoration: none;
    display: flex; flex-direction: column; justify-content: space-between;
    background: var(--surface-dark); border: 1px solid var(--border);
  }
  .cell .num { font-family: var(--serif); font-size: 26px; line-height: 1; }
  .cell .tag { font-size: 11.5px; font-weight: 600; color: var(--muted); line-height: 1.2; }
  .cell.today { background: var(--glow); color: var(--on-glow); border-color: var(--glow); box-shadow: 0 0 24px rgba(var(--glow-rgb),.45), 0 0 4px rgba(var(--flame-rgb),.6); }
  .cell.today .tag { color: var(--on-glow); opacity: .8; }
  .cell.solved { border-color: var(--glow); }
  .cell.solved .tag { color: var(--glow); }
  .cell.locked { background: var(--surface); border-color: transparent; opacity: .45; }
  .cell.locked .num { color: var(--muted); }
  .packing { margin-top: 24px; }
  .packing h2, .section-title { font-size: 22px; margin-bottom: 10px; }
  .item { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
  .item + .item { margin-top: 8px; }
  .item .name { font-weight: 600; }
  .item .desc { color: var(--muted); font-size: 14px; }
  .item svg { flex: none; margin-top: 2px; color: var(--glow); }
  .who { text-align: center; color: var(--muted); font-size: 14px; margin-top: 28px; }
  .who button { background: none; border: 0; color: var(--glow); text-decoration: underline; cursor: pointer; min-height: 44px; padding: 0 6px; }

  /* ---------- Luckan ---------- */
  .eyebrow { color: var(--glow); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .day-head h1 { font-size: 32px; line-height: 1.15; margin: 6px 0 10px; }
  .intro { color: var(--soft); }
  section { margin-top: 28px; }

  .lanterns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; }
  .lantern { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .lantern svg { width: 40px; height: 56px; color: var(--off); }
  .lantern.lit svg { color: var(--glow); filter: drop-shadow(0 0 10px rgba(var(--glow-rgb),.55)); }
  .lantern .flame { fill: transparent; }
  .lantern.lit .flame { fill: var(--flame); }
  .lantern.lit .pane { fill: rgba(var(--flame-rgb),.18); }
  /* Ljus i stället för lyktor (theme.icon = "candle"). */
  .lantern .wax { fill: currentColor; opacity: .35; }
  .lantern.lit .wax { opacity: .9; }
  .lantern.lit svg.candle { color: var(--soft); filter: drop-shadow(0 -6px 12px rgba(var(--flame-rgb),.45)); }
  .lantern.lit svg.candle .flame { fill: var(--flame); }
  .lantern .name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lantern.lit .name { color: var(--text); }
  .lantern-line { text-align: center; color: var(--soft); margin-top: 14px; font-size: 15px; }

  .paper {
    background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: 18px 18px 16px;
    transform: rotate(-1.2deg); box-shadow: 0 10px 24px rgba(0,0,0,.35);
    font-size: 17px; line-height: 1.45; white-space: pre-wrap;
  }
  .paper .from { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; opacity: .6; margin-bottom: 6px; }
  .mine-actions { margin-top: 18px; }
  .on-board { display: flex; align-items: center; gap: 8px; color: var(--glow); font-weight: 600; min-height: 48px; }

  .board { display: flex; flex-direction: column; gap: 10px; }
  .post { background: var(--surface); border-radius: 12px; padding: 12px 14px; }
  .post .meta { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); }
  .post .meta .n { font-weight: 700; }
  .post .meta .t { margin-left: auto; }
  .post .body { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .post .fragment { margin-top: 8px; background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: 10px 12px; white-space: pre-wrap; }
  .post.attempt .body { font-variant-numeric: tabular-nums; }
  .post.attempt .body b { letter-spacing: .12em; }
  .post.solve { border: 1px solid var(--glow); }
  .waiting { border: 1.5px dashed var(--border); border-radius: 12px; padding: 14px; color: var(--muted); text-align: center; }
  .empty { color: var(--muted); font-size: 15px; }

  .note-form { display: flex; gap: 8px; align-items: flex-end; }
  .note-form textarea {
    flex: 1; min-height: 48px; max-height: 160px; resize: none; padding: 12px 14px; border-radius: 12px;
    background: var(--surface-dark); color: var(--text); border: 1px solid var(--border); font: inherit; line-height: 1.35;
  }
  .note-form textarea:focus, .lock-box:focus { outline: 2px solid var(--glow); outline-offset: 1px; }
  .note-count { font-size: 12px; color: var(--muted); text-align: right; margin-top: 4px; min-height: 18px; }

  .lock { background: var(--surface); border-radius: 16px; padding: 18px 16px; }
  .lock-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .lock-head svg { color: var(--glow); }
  .lock.closed .lock-head svg { color: var(--off); }
  .lock-head h2 { font-size: 22px; }
  .lock-boxes { display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; }
  .lock-box {
    width: 52px; height: 64px; text-align: center; font-size: 28px; font-family: var(--serif);
    background: var(--surface-dark); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 0;
    caret-color: var(--glow);
  }
  .lock-box.static { display: flex; align-items: center; justify-content: center; color: var(--glow); border-color: var(--glow); }
  .lock-msg { color: var(--muted); font-size: 15px; text-align: center; }
  .lock-msg.err { color: #FFB4A2; }
  .lock-msg + .btn, .lock-boxes + .btn { margin-top: 4px; }
  .lock-foot { margin-top: 10px; font-size: 13px; color: var(--muted); text-align: center; min-height: 20px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* ---------- Lapptyper ---------- */
  .frag-text { white-space: pre-wrap; }
  .frag-text + .frag-svg, .frag-text + .grid-map { margin-top: 10px; }
  .frag-svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .reveal { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: rgba(var(--glow-rgb),.22); font-weight: 600; }
  .grid-map { display: grid; gap: 2px; font-variant-numeric: tabular-nums; margin: 0 auto; max-width: 340px; }
  .grid-map .lbl { font-size: 12px; font-weight: 600; opacity: .6; display: flex; align-items: center; justify-content: center; }
  .grid-map .c {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 20px;
    background: rgba(42,33,24,.06); border: 1px solid rgba(42,33,24,.18); border-radius: 3px;
  }
  .photo { display: block; width: 100%; max-height: 420px; object-fit: cover; border-radius: 8px; margin-top: 8px; background: var(--surface-dark); }
  .photo-actions { display: flex; flex-direction: column; gap: 8px; }
  .photo-status { color: var(--muted); font-size: 14px; text-align: center; min-height: 20px; }

  /* ---------- Lås: koordinat och val ---------- */
  .coord { display: grid; gap: 4px; margin: 0 auto 16px; max-width: 360px; }
  .coord .lbl { font-size: 13px; color: var(--muted); display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .coord button {
    aspect-ratio: 1; min-height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-dark);
    cursor: pointer; font-size: 13px; color: transparent; padding: 0;
  }
  .coord button[aria-pressed="true"] { background: var(--glow); border-color: var(--glow); color: var(--on-glow); font-weight: 700; }
  .coord-picked { text-align: center; color: var(--soft); margin-bottom: 12px; min-height: 24px; }
  .choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .choices button {
    min-height: 48px; padding: 10px 16px; text-align: left; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-dark); font-size: 16px;
  }
  .choices button[aria-pressed="true"] { border-color: var(--glow); box-shadow: inset 0 0 0 1px var(--glow); color: var(--glow); font-weight: 600; }
  .lock-boxes .lock-box { flex: 0 1 52px; min-width: 0; }
  .lock-box.wide { flex: 0 1 auto; width: auto; padding: 0 18px; font-size: 22px; }

  /* ---------- Arkivlappar med frost ---------- */
  .frag-list { display: flex; flex-direction: column; gap: 14px; }
  .frag .paper-wrap { position: relative; }
  .frag .paper { transform: rotate(-.6deg); font-size: 16px; padding: 14px 16px; }
  .frag:nth-child(even) .paper { transform: rotate(.7deg); }
  .frag .never { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .frost {
    position: absolute; inset: -2px; width: calc(100% + 4px); height: calc(100% + 4px);
    border-radius: 6px; touch-action: none; cursor: grab; transition: opacity .6s ease;
  }
  .frost:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  .frost.gone { opacity: 0; pointer-events: none; }

  /* ---------- Föremålskrav och ledtrådar ---------- */
  .needs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .need { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 999px; font-size: 14px; border: 1px solid var(--border); color: var(--muted); }
  .need svg { width: 18px; height: 18px; }
  .need.have { border-color: var(--glow); color: var(--text); }
  .need.have svg { color: var(--glow); }
  .hints-box { background: var(--surface); border-radius: 16px; padding: 16px; }
  .hints-box .count { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .hint-item { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(58,74,99,.6); }
  .hint-item:first-of-type { border-top: 0; padding-top: 0; }
  .hint-item .no { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-dark); color: var(--glow); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .hint-item .by { font-size: 12px; color: var(--muted); }
  .hint-actions { display: flex; gap: 8px; margin-top: 12px; }
  .hint-actions .btn { flex: 1; }
  .hint-confirm { color: var(--soft); font-size: 15px; margin-top: 12px; }

  .hint-unused { border-top: 1px solid rgba(58,74,99,.6); }
  .hint-unused summary {
    display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; color: var(--muted); list-style: none;
  }
  .hint-unused summary::-webkit-details-marker { display: none; }
  .hint-unused summary::after { content: ''; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s; }
  .hint-unused[open] summary::after { transform: rotate(-135deg); }
  .hint-unused .no { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-dark); color: var(--muted); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .hint-unused .hint-text { padding: 0 0 12px 34px; color: var(--soft); }

  /* ---------- Löst lucka ---------- */
  .solved-meta { color: var(--glow); font-size: 14px; font-weight: 600; text-align: center; margin-top: 20px; }
  .solved-head { text-align: center; }
  .solved-head h1 { font-size: 32px; line-height: 1.15; margin: 6px 0 16px; }
  .epilogue { color: var(--soft); font-size: 17px; }
  .story { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .story li { display: flex; gap: 10px; align-items: flex-start; color: var(--soft); }
  .story li::before { content: ''; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--glow); margin-top: 9px; }
  .new-item { border: 1px solid var(--glow); }

  /* ---------- Meddelandesidor ---------- */
  .message { text-align: center; padding-top: 18vh; }
  .message svg { margin: 0 auto 18px; color: var(--glow); }
  .message h1 { font-size: 34px; margin-bottom: 12px; }
  .message p { color: var(--soft); max-width: 340px; margin: 0 auto 24px; }
  .message .prologue { color: var(--soft); font-size: 17px; text-align: left; background: var(--surface); padding: 18px; border-radius: 14px; margin: 0 auto 24px; max-width: 420px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 12px;
    max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 50;
  }
  .loading { text-align: center; color: var(--muted); padding-top: 30vh; }
</style>
</head>
<body>
<div id="app"><p class="loading">Laddar …</p></div>

<script>
(function(){
  'use strict';

  /* ---------- API ---------- */
  var API_BASE = 'https://games-nordhammer-production.up.railway.app';
  function apiBase(){ try { return (localStorage.getItem('nordhammer:api') || API_BASE || '').replace(/\/+$/, ''); } catch(e){ return API_BASE; } }
  // Svarar alltid { status, body } — även vid fel — så att vyn kan
  // visa rätt sida (403 inte spelare, 503 inte redo, 403 låst lucka).
  function api(method, path, body){
    var profile = NordhammerProfile.current();
    var pid = profile ? profile.id : '';
    var opts = { method: method };
    if (method === 'GET') path += (path.indexOf('?') < 0 ? '?' : '&') + 'profile=' + encodeURIComponent(pid);
    else { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(Object.assign({ profile: pid }, body || {})); }
    return fetch(apiBase() + '/api/kalender' + path, opts).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){ return { status: r.status, body: d }; });
    });
  }

  /* ---------- Små hjälpare ---------- */
  var app = document.getElementById('app');
  // Bygger DOM. Text sätts alltid som text, aldrig som HTML.
  function el(tag, attrs){
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'style') node.setAttribute('style', v);
      else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) add(node, arguments[i]);
    return node;
  }
  function add(node, c){
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function(x){ add(node, x); }); return; }
    node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  // Ikoner (inline-SVG, inga emoji). Bara statiska strängar här.
  var ICONS = {
    back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    star: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>',
    lock: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 018 0v3"/></svg>',
    unlock: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 017.6-1.7"/></svg>',
    check: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    camera: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    bag: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>',

  var THEME_KEY = 'kalender:theme';

  // Varje låstyp ger { node, read() → svar eller null, clear(), focusFirst() }.
  function lockInput(d){
    var lock = d.lock, key = d.day;
    if (lock.type === 'digits' || lock.type === 'word') {
      var digits = lock.type === 'digits', boxes = [];
      for (var i = 0; i < (lock.length | 0); i++) {

      }

        node: el('div', { class: 'lock-boxes', id: 'lock-boxes' }, boxes),
        read: function(){ var a = boxes.map(function(b){ return b.value; }).join(''); return a.length === boxes.length ? a : null; },
        clear: function(){ boxes.forEach(function(b){ b.value = ''; b.dataset.prev = ''; }); },
        focusFirst: function(){ (boxes.filter(function(b){ return !b.value; })[0] || boxes[0]).focus({ preventScroll: true }); }
      };

        picked.textContent = lockPick[key] ? 'Vald ruta: ' + lockPick[key] : 'Tryck på en ruta.';
      }
      add(grid, el('span', { class: 'lbl' }));
      for (var c = 0; c < cols; c++) add(grid, el('span', { class: 'lbl', text: colName(c) }));
      for (var r = 1; r <= rows; r++) {
        add(grid, el('span', { class: 'lbl', text: r }));

  function wireBoxes(boxes, filter){
    boxes.forEach(function(b, i){
      // Flera tecken på en gång (autofyll, snabb inmatning) fördelas
      // över rutorna från den här och framåt.
      b.addEventListener('input', function(){
        var chars = Array.from(filter(b.value));
        if (chars.length > 1 && b.value.length > 1 && b.selectionStart === b.value.length && chars[0] === b.dataset.prev) chars = chars.slice(1);
        b.value = chars[0] || '';
        for (var k = 1; k < chars.length && boxes[i + k]; k++) boxes[i + k].value = chars[k];
        boxes.forEach(function(x){ x.dataset.prev = x.value; });
        var next = boxes[Math.min(i + Math.max(chars.length, 1), boxes.length - 1)];
        if (chars.length && next !== b) next.focus();
      });
      b.addEventListener('keydown', function(e){
        if (e.key === 'Backspace' && !b.value && boxes[i - 1]) { boxes[i - 1].focus(); boxes[i - 1].value = ''; e.preventDefault(); }
        if (e.key === 'ArrowLeft' && boxes[i - 1]) boxes[i - 1].focus();
        if (e.key === 'ArrowRight' && boxes[i + 1]) boxes[i + 1].focus();
      });
      // Klistra in ett helt svar.
      b.addEventListener('paste', function(e){
        var t = Array.from(filter((e.clipboardData || window.clipboardData).getData('text') || ''));
        if (!t.length) return;
        e.preventDefault();
        for (var k = 0; k < boxes.length - i && k < t.length; k++) boxes[i + k].value = t[k];
        boxes.forEach(function(x){ x.dataset.prev = x.value; });
        (boxes[Math.min(i + t.length, boxes.length - 1)]).focus();
      });
      b.addEventListener('focus', function(){ b.select(); });
    });
  }

  // Skalar ned bilden i klienten (längsta sidan högst 1280 px) och
  // sparar som JPEG under 600 kB innan den laddas upp.
  var MAX_PHOTO = 600 * 1024 - 8 * 1024;
  function preparePhoto(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        URL.revokeObjectURL(url);
        var side = 1280, quality = .85;
        function attempt(){
          var scale = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
          var w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          c.toBlob(function(blob){
            if (!blob) return reject(new Error('kodning'));
            if (blob.size > MAX_PHOTO) {
              if (quality > .5) quality -= .1; else side = Math.round(side * .8);
              if (side < 320) return reject(new Error('för stor'));
              return attempt();
            }
            var fr = new FileReader();
            fr.onload = function(){ resolve({ mime: 'image/jpeg', data: String(fr.result).split(',')[1] }); };
            fr.onerror = function(){ reject(new Error('läsning')); };
            fr.readAsDataURL(blob);
          }, 'image/jpeg', quality);
        }
        attempt();
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('bild')); };
      img.src = url;
    });
  }
  var uploading = false;
  function uploadPhoto(file, btn, status){
    if (uploading) return;

      status.textContent = 'Laddar upp …';
      return act('/photo', photo).then(function(res){
        uploading = false;
        if (!res) { btn.disabled = false; status.textContent = ''; return; }
        var b = res.body || {};

        else if (!handleError(res)) toast('Kunde inte ladda upp fotot. Försök igen.');
      });
    }).catch(function(){

    });
  }

  /* ---------- Navigering och uppdatering ---------- */
  function route(){
    var m = /^#dag-(\d{1,2})$/.exec(location.hash);
    return m ? { name: 'day', day: +m[1] } : { name: 'calendar', day: null };
  }
  var loadSeq = 0;
  // Byter vy (visar "Laddar") eller uppdaterar tyst den vy som visas.
  function refresh(){
    var r = route();
    var changed = r.name !== view.name || r.day !== view.day;
    view.name = r.name; view.day = r.day;
    if (changed) { view.data = null; setScreen(el('p', { class: 'loading', text: 'Laddar …' })); window.scrollTo(0, 0); }
    var seq = ++loadSeq;
    var req = r.name === 'day' ? api('GET', '/day/' + r.day) : api('GET', '/state');
    req.then(function(res){
      if (seq !== loadSeq) return; // en nyare hämtning har startat
      if (handleError(res)) return;
      view.data = res.body;
      applyTheme(res.body.theme);
      // En luckas "title" är luckans rubrik; kalenderns titel kommer från /state.
      if (r.name !== 'day' && res.body.title) document.title = res.body.title;
      if (r.name === 'day') renderDay(res.body); else renderCalendar(res.body);
    }, function(){
      if (seq !== loadSeq) return;
      if (view.data) return; // behåll det vi har vid tillfälligt nätfel
      messagePage('Ingen kontakt', 'Kunde inte nå tåget. Kontrollera uppkopplingen.', el('button', { class: 'btn btn-primary', text: 'Försök igen', onclick: function(){ refresh(); } }));
    });
  }

  // Hämtar luckan var 20:e sekund medan sidan är synlig.
  // Inte medan någon skriver — en omritning stänger tangentbordet på mobilen.
  function typing(){ var a = document.activeElement; return !!(a && app.contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName)); }
  setInterval(function(){
    if (document.visibilityState === 'visible' && !busy && !uploading && !typing() && !scratching) refresh();
  }, 20000);
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') refresh(); });
  window.addEventListener('hashchange', function(){ refresh(); });

  NordhammerProfile.ensurePicker(function(){ refresh(); });
})();
</script>
</body>
</html>
